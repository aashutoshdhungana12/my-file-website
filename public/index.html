<!DOCTYPE html>
<html>
<head>
    <title>Aashutosh's File Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            cursor: pointer;
        }

        li {
            list-style: none;
            margin: 12px;
        }

        a {
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📁 Aashutosh's File Storage</h1>

    <p>Personal cloud file storage</p>

    <hr>

    <h3>Upload File</h3>

    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload</button>
    </form>

    <p id="message"></p>

    <hr>

    <h3>My Files</h3>

    <ul id="fileList"></ul>

</div>

<script>

const password = prompt("Enter your password:");

async function loadFiles() {

    const response = await fetch("/files?password=" + encodeURIComponent(password));

    if (!response.ok) {
        document.body.innerHTML = "<h2>Incorrect password.</h2>";
        return;
    }

    const files = await response.json();

    const list = document.getElementById("fileList");

    list.innerHTML = "";

    files.forEach(file => {

        const li = document.createElement("li");

        li.innerHTML =
            file +
            ' <a href="/download/' +
            encodeURIComponent(file) +
            '?password=' +
            encodeURIComponent(password) +
            '">Download</a>' +
            ' <a href="/delete/' +
            encodeURIComponent(file) +
            '?password=' +
            encodeURIComponent(password) +
            '">Delete</a>';

        list.appendChild(li);
    });
}

document.getElementById("uploadForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData(this);

    const response = await fetch("/upload?password=" + encodeURIComponent(password), {
        method: "POST",
        body: formData
    });

    if (response.ok) {
        document.getElementById("message").textContent = "File uploaded successfully.";
        this.reset();
        loadFiles();
    } else {
        document.getElementById("message").textContent = "Upload failed.";
    }

});

loadFiles();

</script>

</body>
</html>
