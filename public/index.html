<!DOCTYPE html>
<html>
<head>
    <title>Aashutosh's File Storage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            width: 450px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>📁 Aashutosh's File Storage</h1>

        <p>My personal cloud file storage</p>

        <a class="button"
           href="https://drive.google.com/drive/folders/1AmRnFYlMwSI-PiiXBJsb4z9BdB43qW8M?usp=drive_link"
           target="_blank">

            Open My Files

        </a>

    </div>

</body>
</html>
